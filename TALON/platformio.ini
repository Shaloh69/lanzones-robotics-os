;
; TALON - Sumobot OS. WeAct Black Pill V3.0 (STM32F411CE), Arduino framework.
;
; Upload note (spec section 7): upload_protocol = dfu (dfu-util) hits a known
; LIBUSB_ERROR_PIPE bootloader bug on this chip. The spec asks for
; "cubeprogrammer", but PlatformIO has NO such protocol - it silently ignores
; the value and never uploads. Same intent, working form: upload_protocol =
; custom invoking STM32CubeProgrammer CLI (must be installed at the path below).
; Board must be in DFU mode first: hold BOOT0, tap NRST, release BOOT0.
;
; USB-CDC virtual buttons (no physical buttons wired yet): PIO_FRAMEWORK_
; ARDUINO_ENABLE_CDC redirects the global Serial object onto the native
; USB port (the same USB-C cable already used for DFU flashing) instead
; of USART1 - #define Serial SerialUSB happens automatically in the core,
; so Config Export/Import and the new virtual-button reader both ride it
; with no other code changes. DFU (bootloader-mode enumeration) and this
; app-mode CDC enumeration never run at the same time, so there's no
; conflict with the upload flow.
;
; VID/PID: the stock blackpill_f411ce board manifest has no "hwids" entry,
; so PIO_FRAMEWORK_ARDUINO_ENABLE_CDC fell back to 0x0000/0x0000 - which is
; almost certainly why no COM port showed up after the first CDC-enabled
; flash (confirmed by the user 2026-07-27). Fixed via boards/blackpill_
; f411ce.json, a project-local copy of the stock manifest with one field
; added: "hwids": [["0x0483", "0x5740"]]. PlatformIO's project boards/
; directory shadows the platform-provided board of the same id, so
; `board = blackpill_f411ce` below now resolves to this copy automatically
; - nothing else changes. 0x0483/0x5740 is ST's own official Virtual COM
; Port demo ID, in Windows' inbox usbser.inf driver database since Win10,
; so this specific pair should bind without needing Zadig. If a COM port
; still doesn't appear after reflashing, that's the next thing to check.

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ${PROJECT_DIR}/../shared
lib_deps =
    olikraus/U8g2@^2.35.19
    pololu/VL53L1X@^1.3.1
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit INA219@^1.2.3
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USB_MANUFACTURER_STRING='"Team Lanzones"'
    -D USB_PRODUCT_STRING='"TALON Sumobot OS"'
upload_protocol = custom
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=usb1 -w "$BUILD_DIR\firmware.bin" 0x08000000 -v -g
