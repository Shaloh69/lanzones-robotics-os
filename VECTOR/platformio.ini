;
; VECTOR - Line Follower OS. WeAct Black Pill V3.0 (STM32F411CE), Arduino framework.
;
; Upload note (spec section 7): upload_protocol = dfu (dfu-util) hits a known
; LIBUSB_ERROR_PIPE bootloader bug on this chip. The spec asks for
; "cubeprogrammer", but PlatformIO has NO such protocol - it silently ignores
; the value and never uploads. Same intent, working form: upload_protocol =
; custom invoking STM32CubeProgrammer CLI (must be installed at the path below).
; Board must be in DFU mode first: hold BOOT0, tap NRST, release BOOT0.

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ${PROJECT_DIR}/../shared
lib_deps =
    olikraus/U8g2@^2.35.19
upload_protocol = custom
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=usb1 -w "$BUILD_DIR\firmware.bin" 0x08000000 -v -g
